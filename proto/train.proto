syntax = "proto3";

package trainbooking;

option go_package = "grpc-train-booking/generated";

service TrainBooking {
  rpc PurchaseTicket(PurchaseRequest) returns (Receipt);
  rpc GetReceipt(UserRequest) returns (Receipt);
  rpc GetUsersBySection(SectionRequest) returns (UserList);
  rpc RemoveUser(UserRequest) returns (Response);
  rpc ModifySeat(ModifySeatRequest) returns (Response);
}

message PurchaseRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
}

message Receipt {
  string from = 1;
  string to = 2;
  string user = 3;
  string email = 4;
  string seat = 5;
  string section = 6;
  double price_paid = 7;
}

message UserRequest {
  string email = 1;
}

message SectionRequest {
  string section = 1;
}

message UserList {
  repeated Receipt users = 1;
}

message ModifySeatRequest {
  string email = 1;
  string new_seat = 2;
  string new_section = 3;
}

message Response {
  string message = 1;
}
